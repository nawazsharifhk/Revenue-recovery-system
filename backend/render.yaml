services:
  - type: web
    name: recoverai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: recoverai-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://your-frontend.vercel.app  # Update after frontend deploy

databases:
  - name: recoverai-db
    databaseName: recoverai
    user: recoverai
    plan: free